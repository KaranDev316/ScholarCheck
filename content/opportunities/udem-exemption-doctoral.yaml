# UdeM exemption — retrieved 2026-11-02. Passages are verbatim spans of
# content/snapshots (see README.md); not source-checked for publication.
id: udem-exemption-doctoral
scheme_name: Bourse d’exemption UdeM pour personnes étudiantes de l’international (3e cycle)
funder: Université de Montréal
destinations:
  - CA
summary: >-
  A tuition-exemption award for international students admitted to a doctoral
  research programme at the Université de Montréal. It exempts the supplemental
  tuition fees charged to international students, so the holder pays the Quebec
  doctoral rate. It is a tuition reduction, not a stipend: the terms state no
  living support, and they exclude applicants who hold an external funding
  source.
links:
  summary_url: https://registraire.umontreal.ca/droits-de-scolarite/bourse-exemption/
  requirements_url: https://esp.umontreal.ca/financement/
  portal_url: https://admission.umontreal.ca/
programmes:
  - id: udem-doctoral-research
    name: Doctoral research programme (3e cycle)
    degree_level: doctoral
    institution: Université de Montréal
    country: CA
    research_component: true
rounds:
  - id: udem-2026-2027
    label: 2026-2027 academic year
    intake: 2026-2027
    route: awarded with admission, without a separate application, once every eligibility condition is met
eligibility_rules:
