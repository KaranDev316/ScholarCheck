# UdeM exemption — retrieved 2026-10-23, not yet human-verified (see README.md).
id: udem-exemption-doctoral
scheme_name: Bourse d’exemption UdeM pour personnes étudiantes de l’international (3e cycle)
funder: Université de Montréal
destinations:
  - CA
summary: >-
  A tuition-exemption award for international students admitted to a doctoral
  research programme at the Université de Montréal. It exempts the supplemental
  tuition fees charged to international students, so the holder pays the Quebec
  doctoral rate. It is a tuition reduction, not a stipend, and the exemption
  terms describe no living support.
