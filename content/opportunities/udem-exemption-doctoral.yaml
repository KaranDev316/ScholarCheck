  - id: udem-full-time-enrolment
    requirement: Be enrolled full-time, without interruption, for the whole programme.
    kind: enrolment_status
    blocking: true
    evidence_refs:
      - ev-udem-eligibility
  - id: udem-no-other-award
    requirement: >-
      Not hold another tuition exemption granted by the Université de Montréal and
      not receive external funding from an organisation or third party.
    kind: other
    blocking: true
    evidence_refs:
      - ev-udem-eligibility
funding_components:
  - id: udem-tuition-exemption
    kind: tuition
    status: specified
    relationship: tuition_reduction
    description: >-
      Exemption from the supplemental tuition fees normally charged to
      international students; the holder pays the same tuition as Quebec
      doctoral students.
    amount: "24067.80"
    currency: CAD
    period: per year (three full-time terms, 45 credits, 2026-2027 rates)
    conditions:
      - The exemption is stated per credit, per full-time term (15 credits) and per year (45 credits).
      - Doctoral research programmes are eligible for 6 to 10 terms, depending on the programme's normal full-time length.
      - The value is set from the supplemental fees determined by the Quebec ministry for 2026-2027.
    evidence_refs:
      - ev-udem-amount
      - ev-udem-duration
      - ev-udem-process
  - id: udem-living-support
    kind: living_support
    status: unspecified
    relationship: not_stated
    description: The exemption terms describe no living support.
    evidence_refs: []
evidence:
  - id: ev-udem-amount
    url: https://registraire.umontreal.ca/droits-de-scolarite/bourse-exemption/
    passage: |-
      Cette exemption vous permet de bénéficier des mêmes frais de scolarité que les personnes étudiantes québécoises en formation universitaire au 3e cycle. Le montant de l'exemption est basé sur le montant des frais supplémentaires facturés aux personnes étudiantes de 3e cycle, déterminé par le Ministère de l'Éducation et de l'Enseignement supérieur.
      Par crédit
      Par trimestre, statut temps plein (Équivalent 15 crédits)
      Par année (3 trimestres), statut temps plein (Équivalent 45 crédits)
      534,84 $
      8 022,60 $
      24 067,80 $
      Année académique 2026-2027
    retrieved_at: 2026-11-02T14:32:37Z
  - id: ev-udem-eligibility
    url: https://registraire.umontreal.ca/droits-de-scolarite/bourse-exemption/
    passage: |-
      Personnes étudiantes de 3e cycle
      Vous pouvez obtenir la bourse d'exemption UdeM, si vous :
      êtes une personne étudiante de l'international (sauf personnes étudiantes françaises et belges francophones)
      avez reçu une offre d’admission dans un programme d'études offert à l'UdeM
      possédez des autorisations d'études valides (CAQ et permis d'études) pour l'ensemble des trimestres de votre programme d'études. Obtenez plus d'information sur les démarches d'immigration
      êtes une personne étudiante inscrite à temps plein pour l'ensemble de votre programme d'études, et ce sans interruption (sauf absence autorisée)
      ne profitez pas déjà d'une autre forme d’exemption des droits de scolarité applicable par l'UdeM
      ne bénéficiez pas d'une source de financement externe de la part d'un organisme ou d'une tierce partie.
    retrieved_at: 2026-11-02T14:32:37Z
  - id: ev-udem-duration
    url: https://registraire.umontreal.ca/droits-de-scolarite/bourse-exemption/
    passage: |-
      Durée d'octroi de l'exemption
      Programmes facturés au statut
      Nombre de trimestres d'admissibilité*
      Doctorat de recherche
      6 à 10
    retrieved_at: 2026-11-02T14:32:37Z
  - id: ev-udem-process
    url: https://registraire.umontreal.ca/droits-de-scolarite/bourse-exemption/
    passage: |-
      Tous les dossiers des personnes candidates éligibles à la Bourse d’exemption UdeM seront évalués lors de la demande d'admission. Vous n'avez donc pas à faire une demande pour obtenir cette bourse d'exemption qui sera versée automatiquement au dossier si toutes les conditions d'admissibilité sont remplies.
    retrieved_at: 2026-11-02T14:32:37Z
