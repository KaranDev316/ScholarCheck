id: cgsd-doctoral
scheme_name: Canada Graduate Research Scholarship – Doctoral (CGRS D)
funder: Government of Canada (CIHR, NSERC and SSHRC)
destinations:
  - CA
summary: >-
  A federal doctoral award of $40,000 per year for 36 months, held while
  enrolled in a doctoral programme at an eligible Canadian institution.
  Applications go either through the applicant's Canadian institution, which
  sets a deadline significantly earlier than the agency's, or directly to the
  agency by 17 October.
